<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f4ed">
<meta name="robots" content="noindex,nofollow">
<title>Blooming · 十月拾捌</title>
<style>
  :root {color-scheme:light; --ink:#315847; --muted:#817b80; --paper:#fff; --bg:#f6f4ed;}
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center;align-items:center;padding:28px 18px}
  .card{width:min(100%,735px);background:var(--paper);border-radius:30px;box-shadow:0 12px 36px rgba(57,53,43,.055);text-align:center;padding:68px clamp(24px,7vw,84px) 58px;animation:appear .5s ease}
  .flower{font-size:50px;line-height:1.2;margin-bottom:16px}
  h1{font-size:42px;line-height:1.1;letter-spacing:0.5px;margin:0 0 8px;font-weight:700}
  .date{font-size:20px;letter-spacing:3.8px;color:#8a7d7d;margin:0}
  .divider{width:56px;height:1px;background:#d9d6ce;margin:36px auto 30px}
  .small{font-size:19px;line-height:1.8;color:#7d747b}
  .days{font-size:56px;line-height:1.25;font-weight:bold;margin:32px 0 28px}
  .clock{font-size:18px;color:#8b7c80;font-variant-numeric:tabular-nums;margin-bottom:44px}
  .hint{font-size:19px;line-height:1.9;color:#817782;margin:0}
  .quote{font-size:17px;line-height:1.8;margin:46px 0 0;color:#897d81}
  .guest-name{font-size:26px;font-weight:700;letter-spacing:1px;margin:12px 0 26px}
  .message{font-size:19px;line-height:2.1;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;color:#4f5350;margin:0}
  .signature{margin-top:38px;color:#8a7d7d;font-size:16px;line-height:1.9}
  .note{margin-top:25px;color:#8a7d7d;font-size:13px}
  [hidden]{display:none!important}
  @keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:600px){body{padding:15px 12px;align-items:flex-start}.card{margin:10px 0;padding:55px 26px 46px;border-radius:26px;min-height:calc(100dvh - 50px)}h1{font-size:36px}.date{font-size:16px;letter-spacing:2.8px}.small,.hint{font-size:16px}.days{font-size:50px}.clock{font-size:16px}.guest-name{font-size:23px}.message{font-size:17px;line-height:2}.flower{font-size:45px}.quote{margin-top:38px;font-size:15px}}
  @media(prefers-reduced-motion:reduce){.card{animation:none}}

  /* 保持原始白底版；只新增簽名及小雛菊飄落 */
  .card{position:relative;overflow:hidden;isolation:isolate}
  .card > :not(.daisy-rain){position:relative;z-index:1}
  .daisy-rain{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:inherit}
  .daisy{position:absolute;left:var(--left);top:-42px;width:calc(var(--size) * 1.2);height:calc(var(--size) * 1.2);opacity:0;color:#e8bc56}
  .daisy svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(60,60,45,.08))}
  .card.revealed .daisy{animation:daisyFall calc(var(--duration) * 1.584) var(--delay) ease-in-out both}
  @keyframes daisyFall{
    0%{opacity:0;transform:translate3d(0,-24px,0) rotate(-35deg)}
    16%{opacity:var(--opacity)}
    72%{opacity:var(--opacity)}
    100%{opacity:0;transform:translate3d(var(--drift),min(720px,100vh),0) rotate(var(--spin))}
  }
  .sign-image{display:block;width:min(295px,82%);height:auto;margin:14px auto 0;object-fit:contain}
  .sign-date{font-size:13px;color:#8a7d7d;letter-spacing:1px;margin-top:7px}
  .card.revealed #guestName{animation:blessingEnter .8s 2.35s both}
  .card.revealed #guestMessage{animation:blessingEnter 1s 2.85s both}
  .card.revealed #guestContent .signature{animation:blessingEnter .9s 3.55s both}
  @keyframes blessingEnter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:600px){.sign-image{width:min(260px,84%)} }
  @media(prefers-reduced-motion:reduce){.card.revealed .daisy,.card.revealed #guestName,.card.revealed #guestMessage,.card.revealed #guestContent .signature{animation:none!important}.daisy{display:none}}

  .envelope-wrap{position:relative;height:188px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
  .envelope-scene{position:relative;width:min(290px,76vw);height:176px;opacity:0;transform:translateY(12px) scale(.98);pointer-events:none}
  .env-back,.env-front,.env-flap,.env-letter{position:absolute;left:50%;transform:translateX(-50%);border-radius:8px}
  .env-back{bottom:18px;width:220px;height:120px;background:#f7f1e7;box-shadow:0 10px 24px rgba(57,53,43,.08)}
  .env-letter{bottom:34px;width:182px;height:102px;background:#fffdf9;border:1px solid #ece3d7;box-shadow:0 6px 12px rgba(50,42,30,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6d7a68}
  .env-letter .mini-sign{width:124px;max-width:76%;height:auto;opacity:.95;margin-top:6px}
  .env-letter .mini-text{font-size:14px;letter-spacing:1.2px;color:#887d80}
  .env-front{bottom:18px;width:220px;height:120px;background:linear-gradient(180deg,#efe7da,#eadfcd);clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0);overflow:hidden}
  .env-front:before,.env-front:after{content:'';position:absolute;top:0;width:50%;height:100%;background:rgba(255,255,255,.25)}
  .env-front:before{left:0;clip-path:polygon(0 0,100% 50%,0 100%)}
  .env-front:after{right:0;clip-path:polygon(100% 0,0 50%,100% 100%)}
  .env-front .heart{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:18px;color:#b05c6d;opacity:.88}
  .env-flap{bottom:78px;width:220px;height:76px;background:linear-gradient(180deg,#f8efe4,#efe4d2);clip-path:polygon(0 100%,50% 0,100% 100%);transform:translateX(-50%) rotateX(0deg);transform-origin:50% 100%;box-shadow:0 2px 8px rgba(50,42,30,.05)}
  .card.revealed .envelope-scene{animation:envAppear .3s .08s both}
  .card.revealed .env-flap{animation:flapOpen .75s .45s ease-out forwards}
  .card.revealed .env-letter{animation:letterRise 1.15s 1.05s ease-out forwards}
  .card.revealed .envelope-scene{animation:envAppear .3s .08s both}
  .card.revealed #guestContent{animation:contentFade .45s 2.0s both}
  @keyframes envAppear{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes flapOpen{0%{transform:translateX(-50%) rotateX(0deg)}100%{transform:translateX(-50%) rotateX(180deg)}}
  @keyframes letterRise{0%{transform:translateX(-50%) translateY(0)}100%{transform:translateX(-50%) translateY(-54px)}}
  @keyframes contentFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:600px){.envelope-wrap{height:170px}.envelope-scene{width:min(260px,80vw);height:164px}.env-back,.env-front{width:200px;height:112px}.env-flap{width:200px;height:70px;bottom:74px}.env-letter{width:166px;height:94px}.env-letter .mini-sign{width:114px}}
  @media(prefers-reduced-motion:reduce){.envelope-scene,.env-flap,.env-letter,#guestContent{animation:none!important}.envelope-wrap{display:none}}

</style>
<script src="./guests.js" defer></script>
<script defer>
(() => {
  // 台灣時間 2026/10/18 13:30；明確指定 +08:00，避免手機時區差異。
  const UNLOCK_TIME = new Date('2026-10-11T13:44:00+08:00').getTime();
  const qs = new URLSearchParams(location.search);
  // 測試網址：?preview=1#01。不會影響正式 QR Code；上線前可移除此功能。
  const preview = qs.get('preview') === '1';
  const $ = id => document.getElementById(id);
  const format2 = n => String(n).padStart(2, '0');
  let lastShown = null;
  function render() {
    const secondsLeft = Math.max(0, Math.ceil((UNLOCK_TIME-Date.now())/1000));
    const unlocked = preview || secondsLeft === 0;
    if(!unlocked){document.querySelector('.card').classList.remove('revealed');lastShown=null;}
    $('countdown').hidden = unlocked;
    $('blessing').hidden = !unlocked;
    if (!unlocked) {
      const d=Math.floor(secondsLeft/86400);
      const h=Math.floor(secondsLeft%86400/3600);
      const m=Math.floor(secondsLeft%3600/60);
      const s=secondsLeft%60;
      $('days').textContent=d+' 天';
      $('clock').textContent=`${h} 小時 ${format2(m)} 分 ${format2(s)} 秒`;
      return;
    }
    const idText = decodeURIComponent(location.hash.slice(1));
    const id = /^\d+$/.test(idText) ? String(Number(idText)) : '';
    const guest = window.BLOOM_GUESTS && window.BLOOM_GUESTS[id];
    $('guestContent').hidden=!guest;
    $('missing').hidden=!!guest;
    if(!guest){document.querySelector('.card').classList.remove('revealed');lastShown=null; $('guestContent').hidden=true;}
    if (guest) {
      // textContent，不把祝福當 HTML 執行，避免符號破版。
      $('guestName').textContent=guest.name;
      $('guestMessage').textContent=guest.message;
      $('guestContent').hidden=false;
      if(lastShown !== id){
        lastShown=id;
        const card=document.querySelector('.card');
        card.classList.remove('revealed');
        void card.offsetWidth;
        card.classList.add('revealed');
      }
    }
  }
  window.addEventListener('DOMContentLoaded',()=>{
    render();
    window.addEventListener('hashchange',render);
    // 即使手機背景分頁暫停計時，回到畫面仍會立即檢查。
    window.addEventListener('focus',render);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
    setInterval(render,1000);
  });
})();
</script>
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false"><defs><symbol id="daisySymbol" viewBox="0 0 100 100"><g fill="#fffdf3" stroke="#e8e4d7" stroke-width="1"><ellipse cx="50" cy="25" rx="10.2" ry="20.5"/><ellipse cx="50" cy="25" rx="10.2" ry="20.5" transform="rotate(45 50 50)"/><ellipse cx="50" cy="25" rx="10.2" ry="20.5" transform="rotate(90 50 50)"/><ellipse cx="50" cy="25" rx="10.2" ry="20.5" transform="rotate(135 50 50)"/><ellipse cx="50" cy="25" rx="10.2" ry="20.5" transform="rotate(180 50 50)"/><ellipse cx="50" cy="25" rx="10.2" ry="20.5" transform="rotate(225 50 50)"/><ellipse cx="50" cy="25" rx="10.2" ry="20.5" transform="rotate(270 50 50)"/><ellipse cx="50" cy="25" rx="10.2" ry="20.5" transform="rotate(315 50 50)"/></g><circle cx="50" cy="50" r="12" fill="#e4b953"/><circle cx="46" cy="46" r="3.4" fill="#f5d988"/></symbol></defs></svg>
<main class="card">
  <div class="daisy-rain" aria-hidden="true"><span class="daisy" style="--left:30%;--size:18px;--delay:2.6s;--duration:6.42s;--drift:28px;--spin:419deg;--opacity:0.62"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:33%;--size:27px;--delay:0.28s;--duration:4.76s;--drift:47px;--spin:235deg;--opacity:0.6"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:70%;--size:27px;--delay:0.26s;--duration:6.42s;--drift:-68px;--spin:467deg;--opacity:0.4"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:80%;--size:25px;--delay:3.07s;--duration:5.7s;--drift:-46px;--spin:420deg;--opacity:0.53"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:17%;--size:23px;--delay:3.0s;--duration:5.36s;--drift:-81px;--spin:424deg;--opacity:0.4"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:26%;--size:25px;--delay:0.39s;--duration:5.63s;--drift:-90px;--spin:430deg;--opacity:0.63"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:48%;--size:21px;--delay:3.17s;--duration:4.32s;--drift:-25px;--spin:189deg;--opacity:0.55"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:15%;--size:24px;--delay:2.57s;--duration:5.45s;--drift:91px;--spin:382deg;--opacity:0.52"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:60%;--size:21px;--delay:0.73s;--duration:6.1s;--drift:27px;--spin:432deg;--opacity:0.58"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:30%;--size:16px;--delay:2.45s;--duration:4.06s;--drift:34px;--spin:200deg;--opacity:0.46"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:30%;--size:13px;--delay:2.96s;--duration:5.05s;--drift:80px;--spin:368deg;--opacity:0.43"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:19%;--size:25px;--delay:1.98s;--duration:5.74s;--drift:-41px;--spin:217deg;--opacity:0.43"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:83%;--size:14px;--delay:1.78s;--duration:5.92s;--drift:45px;--spin:251deg;--opacity:0.5"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:56%;--size:15px;--delay:3.05s;--duration:5.67s;--drift:14px;--spin:236deg;--opacity:0.62"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:37%;--size:23px;--delay:1.32s;--duration:6.35s;--drift:-19px;--spin:179deg;--opacity:0.38"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:35%;--size:13px;--delay:1.74s;--duration:5.61s;--drift:-18px;--spin:208deg;--opacity:0.66"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:54%;--size:13px;--delay:1.7s;--duration:5.5s;--drift:36px;--spin:348deg;--opacity:0.49"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:34%;--size:25px;--delay:1.21s;--duration:5.53s;--drift:-43px;--spin:219deg;--opacity:0.41"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:59%;--size:16px;--delay:0.56s;--duration:6.19s;--drift:56px;--spin:156deg;--opacity:0.62"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:80%;--size:13px;--delay:2.03s;--duration:5.11s;--drift:-30px;--spin:455deg;--opacity:0.6"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:37%;--size:22px;--delay:1.32s;--duration:5.07s;--drift:92px;--spin:424deg;--opacity:0.67"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:54%;--size:24px;--delay:0.75s;--duration:5.61s;--drift:44px;--spin:455deg;--opacity:0.47"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:42%;--size:13px;--delay:2.28s;--duration:5.47s;--drift:86px;--spin:166deg;--opacity:0.68"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:93%;--size:27px;--delay:2.75s;--duration:4.59s;--drift:-68px;--spin:259deg;--opacity:0.59"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:88%;--size:24px;--delay:1.98s;--duration:5.0s;--drift:1px;--spin:167deg;--opacity:0.42"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span><span class="daisy" style="--left:37%;--size:17px;--delay:1.11s;--duration:5.26s;--drift:-35px;--spin:422deg;--opacity:0.54"><svg aria-hidden="true" viewBox="0 0 100 100"><use href="#daisySymbol"/></svg></span></div>
  <div class="flower" aria-hidden="true">🌿</div>
  <h1>Blooming</h1>
  <p class="date">October 18, 2026</p>
  <section id="countdown">
    <div class="divider"></div>
    <p class="small">距離綻放還有</p>
    <div id="days" class="days" aria-live="off">— 天</div>
    <div id="clock" class="clock">— 小時 — 分 — 秒</div>
    <p class="hint">婚禮尾聲，<br>這份專屬於您的祝福<br>即將綻放。</p>

    <img class="sign-image" src="./signature.png" alt="Melvin & Irene 手寫簽名">
  </section>
  <section id="blessing" hidden>
    <div class="divider"></div>
    <div class="envelope-wrap" aria-hidden="true">
        <div class="envelope-scene" id="envelopeStage">

          <div class="env-letter"><div class="mini-text">A Blooming for You</div><img class="mini-sign" src="./signature.png" alt=""></div>

          <div class="env-front"><div class="heart">♥</div></div>
        </div>

      <div id="guestContent" hidden>

      <p class="message" id="guestMessage"></p>

    <div id="missing" hidden>
      <h2 class="guest-name">還找不到這份專屬祝福</h2>

    </div>
    <p class="quote">Every flower blooms at its own time.</p>
  </section>
</main>
