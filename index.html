<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>Blooming · 十月拾捌</title>
<style>
  :root {color-scheme:light; --ink:#315847; --muted:#817b80; --paper:#fff; --bg:#f8f6f2;}
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center;align-items:center;padding:28px 18px}
  .card{width:min(100%,735px);background:var(--paper);border-radius:30px;box-shadow:0 12px 36px rgba(57,53,43,.055);text-align:center;padding:68px clamp(24px,7vw,84px) 58px;animation:appear .5s ease}
  .flower{font-size:50px;line-height:1.2;margin-bottom:16px}
  h1{font-size:42px;line-height:1.1;letter-spacing:0.5px;margin:0 0 8px;font-weight:700}
  .date{font-size:20px;letter-spacing:3.8px;color:#8a7d7d;margin:0}
  .divider{width:56px;height:1px;background:#d9d6ce;margin:36px auto 30px}
  .small{font-size:19px;line-height:1.8;color:#7d747b}
  .days{font-size:56px;line-height:1.25;font-weight:bold;margin:32px 0 28px}
  .clock{font-size:18px;color:#8b7c80;font-variant-numeric:tabular-nums;margin-bottom:44px}
  .hint{font-size:19px;line-height:1.9;color:#817782;margin:0}
  .quote{font-size:17px;line-height:1.8;margin:46px 0 0;color:#897d81}
  .guest-name{font-size:26px;font-weight:700;letter-spacing:1px;margin:12px 0 26px}
  .message{font-size:19px;line-height:2.1;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;color:#4f5350;margin:0}
  .signature{margin-top:38px;color:#8a7d7d;font-size:16px;line-height:1.9}
  .note{margin-top:25px;color:#8a7d7d;font-size:13px}
  /* 花朵生長、祝福展開與少量花瓣，結束後維持靜態以便閱讀 */
  .card{position:relative;overflow:hidden;isolation:isolate}
  .card > *:not(.petals){position:relative;z-index:1}
  .petals{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .petal{position:absolute;top:-35px;font-size:18px;color:#d2adad;opacity:0;user-select:none}
  .petal:nth-child(1){left:11%;--drift:35px;animation-delay:.1s}
  .petal:nth-child(2){left:79%;--drift:-38px;animation-delay:.85s;color:#d8ba8f}
  .petal:nth-child(3){left:54%;--drift:24px;animation-delay:1.4s;color:#b9c9a7}
  .petal:nth-child(4){left:90%;--drift:-25px;animation-delay:2s;color:#e3c5c5}
  .card.revealed .flower{animation:growLeaf 1.35s cubic-bezier(.2,.75,.3,1.25) both}
  .card.revealed #blessing .divider{animation:softAppear .8s .48s both}
  .card.revealed #guestContent .small{animation:softAppear .85s .7s both}
  .card.revealed #guestName{animation:softAppear .85s 1.05s both}
  .card.revealed #guestMessage{animation:softAppear 1s 1.65s both}
  .card.revealed #guestContent .signature{animation:softAppear .95s 2.05s both}
  .card.revealed #blessing .quote{animation:softAppear .9s 2.3s both}
  .card.revealed .petal{animation:fallPetal 4.5s ease-in forwards}
  @keyframes growLeaf{0%{opacity:.1;transform:scale(.32) rotate(-16deg)}70%{opacity:1;transform:scale(1.12) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes softAppear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fallPetal{0%{opacity:0;transform:translate(0,-10px) rotate(-15deg)}18%{opacity:.75}82%{opacity:.65}100%{opacity:0;transform:translate(var(--drift),470px) rotate(155deg)}}
  [hidden]{display:none!important}
  @keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:600px){body{padding:15px 12px;align-items:flex-start}.card{margin:10px 0;padding:55px 26px 46px;border-radius:26px;min-height:calc(100dvh - 50px)}h1{font-size:36px}.date{font-size:16px;letter-spacing:2.8px}.small,.hint{font-size:16px}.days{font-size:50px}.clock{font-size:16px}.guest-name{font-size:23px}.message{font-size:17px;line-height:2}.flower{font-size:45px}.quote{margin-top:38px;font-size:15px}}
  @media(prefers-reduced-motion:reduce){.card,.card.revealed .flower,.card.revealed #blessing .divider,.card.revealed #guestContent .small,.card.revealed #guestName,.card.revealed #guestMessage,.card.revealed #guestContent .signature,.card.revealed #blessing .quote,.card.revealed .petal{animation:none!important}.petal{display:none}}

/* 2026 Blooming invitation theme: olive envelope, cream stationery, wine seal */
:root{--ink:#44573d;--muted:#7e796f;--paper:#fffdf9;--bg:#f3f0e9;--olive:#626d45;--burgundy:#782f43;--gold:#bb9b63}
body{background:radial-gradient(circle at 8% 5%,#ebe8dc,transparent 40%),radial-gradient(circle at 95% 92%,#e8e6db,transparent 35%),var(--bg)}
.card{border:1px solid #e8e2d6;box-shadow:0 18px 50px rgba(55,56,34,.085);padding-top:73px;background:linear-gradient(180deg,#fffdf9 0%,#fffefa 100%)}
.card:before{content:"";height:6px;position:absolute;top:0;left:21%;right:21%;background:repeating-linear-gradient(90deg,#747d56 0 5px,transparent 5px 10px);opacity:.75;z-index:1}
.card:after{content:"";position:absolute;inset:13px;border:1px solid rgba(179,160,132,.24);border-radius:23px;pointer-events:none;z-index:0}
h1{font-family:Georgia,'Times New Roman',serif;color:#455b42;letter-spacing:.025em}
.flower{font-size:44px;margin-bottom:13px}
.date{font-size:15px;letter-spacing:3.1px;color:#867b6f}
.divider{background:linear-gradient(90deg,transparent,#bea989,transparent);width:75px}
.guest-name{color:#475941}
.message{font-size:18px;line-height:2.05}
.quote{font-family:Georgia,serif;font-style:italic;color:#827969}
.signature{margin-top:35px;color:#888175}
.signature-image{display:block;width:min(310px,82%);height:auto;margin:15px auto 4px;object-fit:contain}
.signature-date{font-family:Georgia,serif;letter-spacing:2px;font-size:12px;color:#8b8172}
.seal{display:flex;width:46px;height:46px;margin:27px auto 0;border-radius:50%;background:#7d3548;color:#f4e8d7;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:21px;font-style:italic;box-shadow:0 2px 7px rgba(73,26,31,.18);border:3px double #d8af9c;transform:rotate(-8deg)}
.corner-bloom{position:absolute!important;z-index:0!important;width:94px;height:94px;opacity:.50;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(45,45,30,.04))}
.corner-left{top:33px;left:23px;transform:rotate(-24deg)}
.corner-right{right:13px;bottom:44px;transform:rotate(149deg)}
/* Garden daisies gently fall once when the personal letter is revealed */
.daisy-field{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.daisy-drop{position:absolute;top:-55px;left:var(--x);width:var(--size);height:var(--size);opacity:0;transform:translateY(-30px)}
.daisy-drop svg{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 1px rgba(87,84,41,.11))}
.card.revealed .daisy-drop{animation:daisyFall var(--dur) var(--delay) ease-in-out forwards}
@keyframes daisyFall{0%{opacity:0;transform:translate3d(0,-35px,0) rotate(-24deg)}12%{opacity:var(--o)}80%{opacity:calc(var(--o) * .65)}100%{opacity:0;transform:translate3d(var(--drift),min(640px,90vh),0) rotate(var(--rot))}}
/* Marking: decorative flowers are foreground but brief and translucent. */
.card.revealed .flower{animation:growLeaf 1.4s cubic-bezier(.2,.75,.3,1.15) both}
.card.revealed .signature-image{animation:softAppear 1.05s 2.2s both}
.card.revealed .seal{animation:softAppear .9s 2.5s both}
.card.revealed .petal{display:none}
@media(max-width:600px){.card{padding:57px 27px 48px}.card:after{inset:9px;border-radius:20px}.corner-bloom{width:65px;height:65px;opacity:.36}.corner-left{left:8px;top:29px}.corner-right{right:3px;bottom:34px}.signature-image{width:min(260px,88%)}.message{font-size:17px}}
@media(prefers-reduced-motion:reduce){.card.revealed .daisy-drop,.card.revealed .signature-image,.card.revealed .seal{animation:none!important}.daisy-drop{display:none!important}}

</style>
<script src="./guests.js" defer></script>
<script defer>
(() => {
  // 台灣時間 2026/10/18 13:30；明確指定 +08:00，避免手機時區差異。
  const UNLOCK_TIME = new Date('2026-10-18T13:30:00+08:00').getTime();
  const qs = new URLSearchParams(location.search);
  // 測試網址：?preview=1#01。不會影響正式 QR Code；上線前可移除此功能。
  const preview = qs.get('preview') === '1';
  const $ = id => document.getElementById(id);
  const format2 = n => String(n).padStart(2, '0');
  let shownGuestId = null;
  function render() {
    const secondsLeft = Math.max(0, Math.ceil((UNLOCK_TIME-Date.now())/1000));
    const unlocked = preview || secondsLeft === 0;
    if (!unlocked) { document.querySelector('.card').classList.remove('revealed'); shownGuestId = null; }
    $('countdown').hidden = unlocked;
    $('blessing').hidden = !unlocked;
    if (!unlocked) {
      const d=Math.floor(secondsLeft/86400);
      const h=Math.floor(secondsLeft%86400/3600);
      const m=Math.floor(secondsLeft%3600/60);
      const s=secondsLeft%60;
      $('days').textContent=d+' 天';
      $('clock').textContent=`${h} 小時 ${format2(m)} 分 ${format2(s)} 秒`;
      return;
    }
    const idText = decodeURIComponent(location.hash.slice(1));
    const id = /^\d+$/.test(idText) ? String(Number(idText)) : '';
    const guest = window.BLOOM_GUESTS && window.BLOOM_GUESTS[id];
    $('guestContent').hidden=!guest;
    $('missing').hidden=!!guest;
    if (!guest) { document.querySelector('.card').classList.remove('revealed'); shownGuestId=null; }
    if (guest) {
      // textContent，不把祝福當 HTML 執行，避免符號破版。
      $('guestName').textContent=guest.name;
      $('guestMessage').textContent=guest.message;
      // 只有首次揭曉或切換賓客編號才重播，不會每秒重新播放。
      if (shownGuestId !== id) {
        shownGuestId = id;
        const card = document.querySelector('.card');
        card.classList.remove('revealed');
        void card.offsetWidth;
        card.classList.add('revealed');
      }
    }
  }
  window.addEventListener('DOMContentLoaded',()=>{
    render();
    window.addEventListener('hashchange',render);
    // 即使手機背景分頁暫停計時，回到畫面仍會立即檢查。
    window.addEventListener('focus',render);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
    setInterval(render,1000);
  });
})();
</script>

%;--size:22px;--delay:2.34s;--dur:3.96s;--drift:-33px;--rot:185deg;--o:0.4"><svg viewBox="0 0 100 100"><use href="#daisy"/></svg></span><span class="daisy-drop" style="--x:33%;--size:15px;--delay:2.37s;--dur:4.08s;--drift:12px;--rot:306deg;--o:0.58"><svg viewBox="0 0 100 100"><use href="#daisy"/></svg></span><span class="daisy-drop" style="--x:75%;--size:18px;--delay:2.58s;--dur:4.34s;--drift:-90px;--rot:260deg;--o:0.72"><svg viewBox="0 0 100 100"><use href="#daisy"/></svg></span><span class="daisy-drop" style="--x:19%;--size:18px;--delay:2.82s;--dur:4.83s;--drift:-67px;--rot:254deg;--o:0.37"><svg viewBox="0 0 100 100"><use href="#daisy"/></svg></span><span class="daisy-drop" style="--x:89%;--size:25px;--delay:3.19s;--dur:4.47s;--drift:22px;--rot:182deg;--o:0.54"><svg viewBox="0 0 100 100"><use href="#daisy"/></svg></span><span class="daisy-drop" style="--x:52%;--size:15px;--delay:3.39s;--dur:4.32s;--drift:69px;--rot:147deg;--o:0.66"><svg viewBox="0 0 100 100"><use href="#daisy"/></svg></span><span class="daisy-drop" style="--x:78%;--size:21px;--delay:3.28s;--dur:5.2s;--drift:-44px;--rot:297deg;--o:0.47"><svg viewBox="0 0 100 100"><use href="#daisy"/></svg></span></div>

  <div class="flower" aria-hidden="true">🌿</div>
  <h1>Blooming</h1>
  <p class="date">October 18, 2026</p>
  <section id="countdown">
    <div class="divider"></div>
    <p class="small">距離綻放還有</p>
    <div id="days" class="days" aria-live="off">— 天</div>
    <div id="clock" class="clock">— 小時 — 分 — 秒</div>
    <p class="hint">婚禮尾聲，<br>這份專屬於您的祝福<br>即將綻放。</p>
    <p class="quote">Every flower blooms at its own time.</p>
    <img class="signature-image" src="./signature.png" alt="Melvin &amp; Irene">
  </section>
  <section id="blessing" hidden>
    <div class="divider"></div>
    <div id="guestContent" hidden>
      <p class="small">這一份 Blooming，獻給</p>
      <h2 class="guest-name" id="guestName"></h2>
      <p class="message" id="guestMessage"></p>
      <div class="signature">謝謝你，成為我們生命裡的一部分。<img src="./signature.png" alt="Melvin &amp; Irene" class="signature-image"><span class="signature-date">2026.10.18</span></div>

    </div>

  </section>
